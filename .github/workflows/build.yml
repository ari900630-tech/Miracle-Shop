name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Google Play catalog securely
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install --quiet google-auth requests
          python scripts/generate_play_catalog.py
          if ! git diff --quiet -- play_catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add play_catalog.json
            git commit -m "Update Google Play catalog"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: miracle-shop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
